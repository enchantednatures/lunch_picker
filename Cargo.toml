[package]
name = "lunch_picker"
version = "0.1.0"
edition = "2021"

[profile.release]
panic = 'abort'
codegen-units = 1
opt-level = 's' # or 'z' to optimize "aggressively" for size
lto = true

[profile.dev.package.sqlx-macros]
opt-level = 3

[features]
sqlite_tests = []

[dependencies]
clap = { version = "4", features = ["derive"] }
rand = { version = "0.8", default-features = false }
dialoguer = { version = "0.11", default-features = false }
serde = { version = "1.0", default-features = false }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"], default-features = false }
tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false }
opentelemetry = { version = "0.23", default-features = false }
tracing-opentelemetry = { version = "0.24", default-features = false }
opentelemetry_sdk = { version = "0.23", features = ["rt-tokio"], default-features = false }
opentelemetry-otlp = "0.16"
futures = { version = "0.3", features = ["executor"], default-features = false }
dirs = "5.0.1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
scraper = { version = "0.19", default-features = false }
regex = { version = "1", default-features = false, features = ["unicode-perl"] }


[dependencies.sqlx]
version = "0.7"
features = ["chrono", "macros", "migrate", "sqlite", "runtime-tokio-rustls"]
default-features = false

